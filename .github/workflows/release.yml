name: Release

# Run from the Actions tab on the default branch after running the EditMode tests locally. It writes the version into
# package.json, tags the commit, attaches the package's zip to a GitHub release and updates the VPM listing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release v${{ inputs.version }}
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse a version already released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already tagged."
            exit 1
          fi

      - run: python3 .github/scripts/vpm.py set-version "$VERSION"

      - run: python3 .github/scripts/check.py

      - run: python3 .github/scripts/vpm.py package .build/release --tag "v$VERSION"

      # The branch and the tag go up together, so a rejected push leaves neither behind.
      - name: Commit and tag the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit --all --message "Release v$VERSION"
          fi
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$VERSION"

      - name: Create the release
        run: gh release create "v$VERSION" .build/release/*.zip --verify-tag --title "v$VERSION" --generate-notes

      # GitHub Pages deploys only from the default branch, so the listing is rebuilt there rather than from the tag.
      - name: Update the listing
        run: gh workflow run listing.yml --ref "$GITHUB_REF_NAME"
