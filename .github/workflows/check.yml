name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The EditMode tests need a licensed Unity editor and run on a developer's machine. This checks what needs no Unity.
jobs:
  check:
    name: Translations, manifests, .meta files and the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 .github/scripts/check.py

      - run: python3 .github/scripts/vpm.py package .build/release
